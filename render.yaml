services:
  - type: web
    name: mini-ecommerce-backend
    env: node
    region: oregon
    plan: starter
    buildCommand: "npm install"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        fromDatabase: false
      - key: MONGO_URL
        fromDatabase: false
      - key: SESSION_SECRET
        fromDatabase: false
      - key: CORS_ORIGIN
        fromDatabase: false
